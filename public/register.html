<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · SlipSmart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="" class="auth-page">
  <main class="container py-5">
    <div class="col-md-5 col-lg-4 mx-auto">
      <div class="text-center mb-4">
        <i class="bi bi-ticket-perforated-fill text-success fs-1"></i>
        <h4 class="fw-bold mt-2">Create your account</h4>
        <p class="text-secondary small">Join to unlock slips and AI-generated odds.</p>
      </div>
      <div class="card"><div class="card-body p-4">
        <div id="form-error" class="alert alert-danger d-none small"></div>
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" id="name" required placeholder="Kwame Mensah">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="age-check" required>
            <label class="form-check-label small" for="age-check">I confirm I am 18 years or older.</label>
          </div>
          <button class="btn btn-success w-100" id="submit-btn">Create account</button>
        </form>
      </div></div>
      <p class="text-center small text-secondary mt-3">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
