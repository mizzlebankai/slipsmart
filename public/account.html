<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account · SlipSmart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="">
  <main class="container py-4">
    <div id="login-prompt" class="text-center d-none">
      <div class="card col-lg-5 mx-auto"><div class="card-body p-4">
        <i class="bi bi-person-lock fs-1 text-secondary"></i>
        <h6 class="fw-bold mt-2">Log in to view your account</h6>
        <a href="/login.html?next=/account.html" class="btn btn-success">Log in</a>
      </div></div>
    </div>

    <div id="account-app" class="d-none">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card mb-3"><div class="card-body text-center p-4">
            <i class="bi bi-person-circle fs-1 text-secondary"></i>
            <h5 class="fw-bold mb-0" id="acc-name"></h5>
            <p class="small text-secondary" id="acc-email"></p>
            <div class="d-flex justify-content-center gap-3 mt-3">
              <div><div class="fs-5 fw-bold text-success" id="acc-credits">0</div><small class="text-secondary">AI credits</small></div>
              <div><div class="fs-5 fw-bold text-success" id="acc-purchases">0</div><small class="text-secondary">Purchases</small></div>
            </div>
            <a href="/ai-odds.html" class="btn btn-sm btn-outline-success mt-3"><i class="bi bi-stars"></i> Get more credits</a>
          </div></div>
        </div>

        <div class="col-lg-8">
          <div class="card">
            <div class="card-header"><i class="bi bi-bag text-success"></i> Purchase history</div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead><tr><th>Item</th><th>Reference</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr></thead>
                  <tbody id="purchase-rows"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="slip-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title">Slip</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="modal-body" style="white-space:pre-line"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
