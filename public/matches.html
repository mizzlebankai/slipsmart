<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matches · SlipSmart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="matches">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h3 class="mb-0"><span class="ss-live-dot"></span>Matches</h3>
      <button id="refresh" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>

    <div id="demo-banner" class="alert alert-warning d-none">
      <i class="bi bi-info-circle"></i> <strong>Demo data.</strong> Add your <code>APISPORTS_KEY</code> in the <code>.env</code> file to stream real live fixtures. These sample matches exist so you can explore the platform.
    </div>

    <ul class="nav nav-pills mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="live">Live</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="today">Today</button></li>
    </ul>

    <div id="match-list"></div>
    <p class="small text-secondary mt-2">Fixtures update when you press Refresh. Click any match for details and AI prediction.</p>
  </main>

  <div class="modal fade" id="match-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="mm-title">Match details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="mm-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/matches.js"></script>
</body>
</html>
